name: temporary-whisper-model-fetch

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify Whisper large-v3-turbo Q5 model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors \
            -o ggml-large-v3-turbo-q5_0.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin?download=true'
          echo '394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2  ggml-large-v3-turbo-q5_0.bin' | sha256sum -c -
      - name: Publish temporary model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-large-v3-turbo-q5_0.bin
          path: ggml-large-v3-turbo-q5_0.bin
          compression-level: 0
          retention-days: 1
