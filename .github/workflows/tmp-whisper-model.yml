name: temporary-whisper-model-fetch

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download and hash Whisper small English Q5 model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors \
            -o ggml-small.en-q5_1.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en-q5_1.bin?download=true'
          sha256sum ggml-small.en-q5_1.bin | tee ggml-small.en-q5_1.sha256
      - name: Publish model artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggml-small.en-q5_1
          path: |
            ggml-small.en-q5_1.bin
            ggml-small.en-q5_1.sha256
          compression-level: 0
          retention-days: 1
