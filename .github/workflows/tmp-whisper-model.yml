name: temporary-whisper-model-fetch

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  fetch-model:
    runs-on: ubuntu-latest
    steps:
      - name: Download, verify, and split Whisper large-v3-turbo Q5 model
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 5 --retry-all-errors \
            -o ggml-large-v3-turbo-q5_0.bin \
            'https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo-q5_0.bin?download=true'
          echo '394221709cd5ad1f40c46e6031ca61bce88931e6e088c188294c6d5a55ffa7e2  ggml-large-v3-turbo-q5_0.bin' | sha256sum -c -
          split -b 287M -d -a 1 ggml-large-v3-turbo-q5_0.bin model.part-
          sha256sum model.part-* > model.parts.sha256
      - name: Publish model part 0
        uses: actions/upload-artifact@v4
        with:
          name: whisper-model-part-0
          path: model.part-0
          compression-level: 0
          retention-days: 1
      - name: Publish model part 1
        uses: actions/upload-artifact@v4
        with:
          name: whisper-model-part-1
          path: model.part-1
          compression-level: 0
          retention-days: 1
      - name: Publish part checksums
        uses: actions/upload-artifact@v4
        with:
          name: whisper-model-parts-sha256
          path: model.parts.sha256
          compression-level: 0
          retention-days: 1
